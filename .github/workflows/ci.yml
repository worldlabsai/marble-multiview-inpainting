name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run pyright
      - run: ./marble-inpaint demo --output demo-output/
      - run: ./marble-inpaint inspect demo-output/prepared/
